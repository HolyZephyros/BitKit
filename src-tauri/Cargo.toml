[package]
name = "bitkit"
version = "2.0.1"
description = "BitKit — All-in-one media toolkit powered by yt-dlp & ffmpeg"
authors = ["BitKit"]
license = "MIT"
edition = "2021"

[lib]
name = "bitkit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
arboard = "3"
dirs = "6"
chrono = "0.4"
opener = "0.7"
sys-locale = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
